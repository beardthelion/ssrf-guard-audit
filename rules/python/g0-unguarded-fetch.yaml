rules:
  - id: ssrf-guard-audit-g0-python
    mode: taint
    message: >-
      Caller-shaped URL input reaches an outbound request with no recognized
      complete SSRF guard on the intra-function taint path (G0: no guard).
      Weak or unrecognized guards also produce this raw finding; the scan
      pipeline suppresses or relabels it per the layered site resolution in
      docs/source-sink-matrix.md.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: G0
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ssrf, python]
      advisory_refs:
        - "shape reference: modelcontextprotocol/servers mcp-server-fetch passes the caller-supplied URL to a client with redirects followed and no guard (no CVE; live target)"
      references:
        - docs/source-sink-matrix.md
    # Sources: the entry-point vocabulary of docs/source-sink-matrix.md --
    # URL-named parameters, URL-named field reads, request-object members,
    # and registered entry points (route decorators, tool registrations,
    # dispatch methods, Tool-class entry methods).
    pattern-sources:
      # Sources (the contract lives in docs/source-sink-matrix.md). A source
      # is any caller-shaped URL input: an explicit URL parameter, a
      # URL-named field read off a config/request/payload object, a
      # request-object member (query/body), or a parameter of a registered
      # entry point (web route decorators, agent/tool registrations,
      # dispatch methods, Tool-class entry methods). A tainted parameter
      # stays tainted for the whole function body (parameter stickiness);
      # the matrix doc covers the ceiling notes.
      #
      # URL-named parameters of any function or method, registered or not:
      # `def fetch(url)` is an entry point for this analyzer.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|callback|webhook_?url|webhook|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  async def $F(..., $ARG, ...):
                    ...
      # Suffix forms: page_url, callbackUrl, feed_url, site_url, ...
      # Case-sensitive camel halves keep `curl`-style names out.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^([a-z_0-9]+_(url|uri|href|endpoint|webhook)|[a-z_0-9]+(Url|Uri|Href|Endpoint|Webhook))(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  async def $F(..., $ARG, ...):
                    ...
      # URL-named attribute reads off any object (config objects, payload
      # models, parsed request objects): cfg.webhook_url, options.url,
      # request.url, ...
      - patterns:
          - pattern: $X.$F
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)$'
      # URL-named key reads: config["webhook_url"], payload.get("url"),
      # request.args["target"], kwargs["feed_url"], ...
      - patterns:
          - pattern-either:
              - pattern: $X[$K]
              - pattern: $X.get($K, ...)
          - metavariable-regex:
              metavariable: $K
              regex: >-
                (?i)^["'](url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)["']$
      # HTTP request-object members (Flask/Django/FastAPI/Starlette/aiohttp
      # style): query/body member reads off a request receiver are
      # caller-controlled. Receiver-gated so unrelated .data/.params
      # attributes are not sources.
      - patterns:
          - pattern: $REQ.$F
          - metavariable-regex:
              metavariable: $REQ
              regex: '(.*\.)?(request|req)$'
          - metavariable-regex:
              metavariable: $F
              regex: '^(args|GET|POST|query_params|path_params|form|data|json|params|values|query|body)$'
      # Route decorators: any parameter of a function registered via a web
      # route/handler decorator (Flask/Bottle @app.route/@get,
      # FastAPI/Starlette @router.get, Django REST @api_view/@action). The
      # decorator method name is the signal, not the receiver.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $DECO
              regex: '(.*\.)?(route|api_route|get|post|put|delete|patch|head|options|websocket|add_url_rule|api_view|action)$'
          - pattern-either:
              - pattern-inside: |
                  @$DECO(...)
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO(...)
                  async def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  async def $F(..., $ARG, ...):
                    ...
      # Agent/tool registrations (one entry family among several): any
      # parameter of a function decorated as a tool entry point. The
      # decorator method name is the signal, not the receiver, so FastMCP,
      # low-level SDK servers, and vendored variants all match. A tainted
      # `arguments` dict taints every value extracted from it
      # (arguments["url"], arguments.get("url")).
      - patterns:
          - pattern: $ARG
          # metavariable-regex is a full match on the bound text, so the
          # receiver prefix must be spelled out.
          - metavariable-regex:
              metavariable: $DECO
              regex: '(.*\.)?(tool|call_tool|get_prompt)'
          - pattern-either:
              - pattern-inside: |
                  @$DECO(...)
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO(...)
                  async def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  async def $F(..., $ARG, ...):
                    ...
      # Dispatch-method source: a function or method named like a tool
      # dispatcher whose parameters include args/params/request. Covers
      # class-based registries where a registered callback delegates to
      # `tool.execute(args)` and the sink lives in the method body.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(args|arguments|params|request|input)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  async def $M(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  def $M(..., $ARG, ...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(execute|handle|dispatch|process|invoke|run|call)[a-z_0-9]*$'
      # Framework tool-entry source: agent frameworks that deliver
      # caller-produced args through `Tool.forward`/`BaseTool._run`-style
      # methods on Tool-named classes. The class-name bound keeps the
      # method names from matching arbitrary helpers. First branch: named
      # params. Second: **kwargs, which Semgrep binds separately as a
      # ParamDict.
      - patterns:
          - pattern: $ARG
          - pattern-either:
              - pattern-inside: |
                  class $T(...):
                    ...
                    async def $M($SELF, ..., $ARG, ...):
                      ...
              - pattern-inside: |
                  class $T(...):
                    ...
                    def $M($SELF, ..., $ARG, ...):
                      ...
          - metavariable-regex:
              metavariable: $T
              regex: '(?i).*tool'
          - metavariable-regex:
              metavariable: $M
              regex: '^(forward|_?run|_?arun|_?call|_?execute|invoke|process)[a-z_0-9]*$'
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(?!self$|cls$).*'
      - patterns:
          - pattern: $KW
          - pattern-either:
              - pattern-inside: |
                  class $T(...):
                    ...
                    async def $M($SELF, ..., **$KW):
                      ...
              - pattern-inside: |
                  class $T(...):
                    ...
                    def $M($SELF, ..., **$KW):
                      ...
          - metavariable-regex:
              metavariable: $T
              regex: '(?i).*tool'
          - metavariable-regex:
              metavariable: $M
              regex: '^(forward|_?run|_?arun|_?call|_?execute|invoke|process)[a-z_0-9]*$'
    # Sinks: outbound request calls listed in docs/source-sink-matrix.md.
    # Client-object method calls are recognized by receiver name
    # (client/session), which is the documented heuristic for
    # `client.get(url)`-style sinks.
    pattern-sinks:
      - pattern-either:
          - pattern: requests.$M(...)
          - pattern: httpx.$M(...)
          - pattern: aiohttp.$M(...)
          - pattern: urllib.request.$M(...)
          - patterns:
              - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(urlopen|urlretrieve)'
          - patterns:
              - pattern: $R.$M(...)
              - metavariable-regex:
                  metavariable: $R
                  regex: '(?i).*(client|session|driver)[a-z_0-9]*'
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(get|post|put|delete|head|patch|options|request|stream|fetch|ws_connect)$'
          - patterns:
              - pattern: $P.goto(...)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?i).*(page|browser|driver)[a-z_0-9]*'
          - patterns:
              - pattern: $C.request.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(get|post|put|delete|head|patch|options|request|stream)$'
    # Sanitizers: only the recognized complete-guard call vocabulary
    # (resolve-all + range check + pinned connect wrappers; see
    # docs/source-sink-matrix.md). by-side-effect covers check-and-throw
    # validators that sanitize their argument without returning it.
    # Deliberately absent: urlparse, ipaddress, is_safe_url, validate_url,
    # and every other partial or unrecognized guard name. Those leave the
    # value tainted so the site resolves to a weak class or to
    # unrecognized-guard downstream instead of going silent.
    pattern-sanitizers:
      # A single focused by-side-effect entry covers both forms:
      # `checked = validate_public_url(url)` (the call result is clean) and
      # `assert_public_url(x)` (the argument l-value is clean going forward).
      # focus-metavariable is required for by-side-effect to work, and a
      # second unfocused sanitizer entry on the same call disables the
      # side-effect behavior, so this must stay a single entry. Ceiling:
      # it cannot clean a raw handler parameter (the param binding is the
      # source and stays tainted for the whole function body in Semgrep
      # CE); it does clean locals derived from the parameter. Sites that
      # check-and-throw on the raw param still fire here and resolve to
      # recognized-complete via the complete-guard site probe
      # (docs/source-sink-matrix.md).
      - by-side-effect: true
        patterns:
          - pattern: $GUARD($X, ...)
          - metavariable-regex:
              metavariable: $GUARD
              regex: '(?i)((.*[._])?(ssrf|safe_?fetch|safe_?get|safe_?request|assert_?safe|ensure_?public|require_?public)|.*(public_?url|resolve_?and_?pin|pinned_?request))[a-z_0-9]*'
          - focus-metavariable: $X
