rules:
  - id: ssrf-guard-audit-g6-typescript
    mode: taint
    message: >-
      Caller-shaped URL input reaches a request that follows redirects
      without re-validating each hop (G6: redirect re-validation missing).
      fetch defaults to redirect:"follow", and axios/got follow redirects
      unless maxRedirects is 0 or a redirect handler re-checks every
      Location target. Entry-URL validation does not protect the second
      hop. See docs/source-sink-matrix.md.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: G6
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [ssrf, typescript, javascript]
      advisory_refs:
        - "CVE-2026-55525 / CVE-2026-55523 / CVE-2026-55524 / GHSA-5r34-2g38-6569 (PraisonAI web crawl follows redirects after entry-URL validation; Python corpus anchor, same guard shape)"
      references:
        - docs/source-sink-matrix.md
    # Sources: the entry-point vocabulary of docs/source-sink-matrix.md --
    # URL-named parameters, URL-named member reads, request-object members,
    # and registered entry points (router registrations, tool
    # registrations, verb-named handlers, dispatch methods).
    pattern-sources:
      # Sources (the contract lives in docs/source-sink-matrix.md). A source
      # is any caller-shaped URL input: an explicit URL parameter, a
      # URL-named member read off a config/request/payload object, a
      # request-object member (query/body), or a parameter of a registered
      # entry point (web framework registrations, agent/tool
      # registrations, dispatch methods).
      #
      # URL-named parameters of any function, method, or arrow, registered
      # or not: `function fetch(url)` is an entry point for this analyzer.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|callback|webhook_?url|webhook|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => $E
              - pattern-inside: |
                  async (..., $ARG, ...) => $E
      # Suffix forms: pageUrl, feed_url, imageUrl, ... Case-sensitive
      # camel halves keep `curl`-style names out.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^([a-z_0-9]+_(url|uri|href|endpoint|webhook)|[a-z_0-9]+(Url|Uri|Href|Endpoint|Webhook))(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => $E
              - pattern-inside: |
                  async (..., $ARG, ...) => $E
      # URL-named member reads off any object (config objects, payload
      # objects, parsed request objects): cfg.webhookUrl, options.url,
      # req.url, ...
      - patterns:
          - pattern: $X.$F
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)$'
      # URL-named key reads: config["webhook_url"], payload.get("url"),
      # req.query["target"], searchParams.get("feedUrl"), ...
      - patterns:
          - pattern-either:
              - pattern: $X[$K]
              - pattern: $X.get($K, ...)
          - metavariable-regex:
              metavariable: $K
              regex: >-
                (?i)^["'](url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)["']$
      # HTTP request-object members (Express/Fastify `req`, Koa/Hono `ctx`,
      # Next `request`): query/body member reads off a request receiver
      # are caller-controlled. `ctx.request` (Koa, and Playwright context
      # request clients) is included so members under it stay derived.
      - patterns:
          - pattern-either:
              - pattern: $REQ.$F
              - pattern: $REQ.$F(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: '(.*\.)?(req|request|ctx)$'
          - metavariable-regex:
              metavariable: $F
              regex: '^(query|body|params|param|querystring|nextUrl|searchParams|formData|data|json|args|GET|POST|query_params|path_params|form|values|request)$'
      # Destructured request fields: const { url } = req.query
      - patterns:
          - pattern: $PROP
          - metavariable-regex:
              metavariable: $REQ
              regex: '(.*\.)?(req|request|ctx)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(query|body|params|nextUrl|searchParams|formData)$'
          - pattern-either:
              - pattern-inside: |
                  const { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  let { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  var { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  { ..., $PROP, ... } = $REQ.$M
      # Verb-named route handlers (Next.js style): export async function
      # GET(request) — the request parameter is the source.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $H
              regex: '^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$'
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(req|request|ctx|event)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $H(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $H(..., $ARG, ...) { ... }
              - pattern-inside: |
                  const $H = async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  const $H = (..., $ARG, ...) => { ... }
      # Web framework registrations: the first parameter of an inline
      # callback passed to a router verb (Express/Fastify `app.get(...)`,
      # `router.post(...)`, `server.use(...)`) is the request object.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $M
              regex: '(?i)^(get|post|put|delete|del|patch|head|options|all|use|route|ws)$'
          - pattern-either:
              - pattern-inside: |
                  $APP.$M(..., ($ARG, ...) => { ... })
              - pattern-inside: |
                  $APP.$M(..., async ($ARG, ...) => { ... })
              - pattern-inside: |
                  $APP.$M(..., function $H($ARG, ...) { ... })
              - pattern-inside: |
                  $APP.$M(..., async function $H($ARG, ...) { ... })
      # Agent/tool registrations (one entry family among several): any
      # parameter of a callback registered through a tool registration
      # method (tool, registerTool, setRequestHandler, and the
      # prompt/resource variants). Also covers object-destructured
      # parameters such as `async ({ url }) => ...`.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $REG
              regex: '(tool|registerTool|callTool|getPrompt|setRequestHandler|prompt|resource)'
          - pattern-either:
              - pattern-inside: |
                  $SRV.$REG(..., async (..., $ARG, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., (..., $ARG, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., async (..., $ARG, ...) => ...)
              - pattern-inside: |
                  $SRV.$REG(..., (..., $ARG, ...) => ...)
              - pattern-inside: |
                  $SRV.$REG(..., async function $H(..., $ARG, ...) { ... })
              - pattern-inside: |
                  $SRV.$REG(..., function $H(..., $ARG, ...) { ... })
      - patterns:
          - pattern: $PROP
          - metavariable-regex:
              metavariable: $REG
              regex: '(tool|registerTool|callTool|getPrompt|setRequestHandler|prompt|resource)'
          - pattern-either:
              - pattern-inside: |
                  $SRV.$REG(..., async ({ ..., $PROP, ... }, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., ({ ..., $PROP, ... }, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., async ({ ..., $PROP, ... }: $T, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., ({ ..., $PROP, ... }: $T, ...) => { ... })
      # Dispatch-method source: a method, function declaration, or
      # object-literal callback named like a tool dispatcher that takes an
      # args/params/request parameter. Covers class-based registries where
      # a CallTool switch delegates to `tool.execute(args, ...)` and the
      # sink lives inside the method body rather than the callback.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(args|arguments|params|request|input)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  async $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  function $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $M: async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  $M: (..., $ARG, ...) => { ... }
          - metavariable-regex:
              metavariable: $M
              regex: '^(execute|handle|dispatch|process|invoke|run|call)[a-zA-Z_0-9]*$'
    pattern-sinks:
      - pattern-either:
          # fetch(url) defaults to redirect:"follow". Suppress the manual
          # and error policies and options objects carrying a per-hop
          # redirect callback.
          - patterns:
              - pattern-either:
                  - pattern: fetch($U, ...)
                  - pattern: nodeFetch($U, ...)
              - pattern-not: 'fetch($U, { ..., redirect: "manual", ... })'
              - pattern-not: 'fetch($U, { ..., redirect: ''manual'', ... })'
              - pattern-not: 'fetch($U, { ..., redirect: "error", ... })'
              - pattern-not: 'fetch($U, { ..., redirect: ''error'', ... })'
              - pattern-not: 'fetch($U, { ..., beforeRedirect: ..., ... })'
              - pattern-not: 'fetch($U, { ..., onRedirect: ..., ... })'
              - pattern-not: 'fetch($U, { ..., redirectHandler: ..., ... })'
              - pattern-not: 'fetch($U, { ..., checkRedirect: ..., ... })'
          # axios/got follow redirects by default. maxRedirects:0,
          # followRedirect:false, or a redirect-policy callback suppresses.
          - patterns:
              - pattern-either:
                  - pattern: axios($U, ...)
                  - pattern: axios.$M($U, ...)
                  - pattern: got($U, ...)
                  - pattern: got.$M($U, ...)
              - pattern-not: '$F($U, { ..., maxRedirects: 0, ... })'
              - pattern-not: '$F($U, { ..., followRedirect: false, ... })'
              - pattern-not: '$F($U, { ..., followRedirects: false, ... })'
              - pattern-not: '$F($U, { ..., beforeRedirect: ..., ... })'
              - pattern-not: '$F($U, { ..., onRedirect: ..., ... })'
              - pattern-not: '$F($U, { ..., redirectHandler: ..., ... })'
              - pattern-not: '$F($U, { ..., checkRedirect: ..., ... })'
          # Options-object call forms: axios({ url, ... }) etc.
          - patterns:
              - pattern-either:
                  - pattern: 'axios({ ..., url: $U, ... })'
                  - pattern: 'axios.$M({ ..., url: $U, ... })'
                  - pattern: 'got({ ..., url: $U, ... })'
                  - pattern: 'got.$M({ ..., url: $U, ... })'
              - pattern-not: '$F({ ..., url: $U, ..., maxRedirects: 0, ... })'
              - pattern-not: '$F({ ..., url: $U, ..., followRedirect: false, ... })'
              - pattern-not: '$F({ ..., url: $U, ..., followRedirects: false, ... })'
              - pattern-not: '$F({ ..., url: $U, ..., beforeRedirect: ..., ... })'
              - pattern-not: '$F({ ..., url: $U, ..., onRedirect: ..., ... })'
              - pattern-not: '$F({ ..., url: $U, ..., redirectHandler: ..., ... })'
          # Browser navigation: page/browser/ctx.goto(tainted). Browser
          # redirects happen inside the navigation, so pre-request
          # validation alone is the G6 shape.
          - patterns:
              - pattern: $P.goto($U, ...)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?i).*(page|browser|ctx)[a-z_0-9]*'
          # ctx.request.<method>(tainted) and request(tainted).
          - patterns:
              - pattern: $C.request.$M($U, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(get|post|put|delete|head|patch|options|request|stream)$'
          - pattern: request($U, ...)
    # Same recognized-complete vocabulary as G0. by-side-effect stays a
    # single focused entry; see g0-unguarded-fetch.yaml for why.
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern: $GUARD($X, ...)
          - metavariable-regex:
              metavariable: $GUARD
              regex: '(?i)((.*[._])?(ssrf|safe_?fetch|safe_?get|safe_?request|assert_?safe|ensure_?public|require_?public)|.*(public_?url|resolve_?and_?pin|pinned_?request))[a-z_0-9]*'
          - focus-metavariable: $X
