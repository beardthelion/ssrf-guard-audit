rules:
  - id: ssrf-guard-audit-g0-typescript
    mode: taint
    message: >-
      Caller-shaped URL input reaches an outbound request with no recognized
      complete SSRF guard on the intra-function taint path (G0: no guard).
      Weak or unrecognized guards also produce this raw finding; the scan
      pipeline suppresses or relabels it per the layered site resolution in
      docs/source-sink-matrix.md.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: G0
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ssrf, typescript, javascript]
      advisory_refs:
        - "shape reference: modelcontextprotocol/servers mcp-server-fetch passes the caller-supplied URL to a client with redirects followed and no guard (no CVE; live target)"
      references:
        - docs/source-sink-matrix.md
    # Sources: the entry-point vocabulary of docs/source-sink-matrix.md --
    # URL-named parameters, URL-named member reads, request-object members,
    # and registered entry points (router registrations, tool
    # registrations, verb-named handlers, dispatch methods).
    pattern-sources:
      # Sources (the contract lives in docs/source-sink-matrix.md). A source
      # is any caller-shaped URL input: an explicit URL parameter, a
      # URL-named member read off a config/request/payload object, a
      # request-object member (query/body), or a parameter of a registered
      # entry point (web framework registrations, agent/tool
      # registrations, dispatch methods).
      #
      # URL-named parameters of any function, method, or arrow, registered
      # or not: `function fetch(url)` is an entry point for this analyzer.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|callback|webhook_?url|webhook|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => $E
              - pattern-inside: |
                  async (..., $ARG, ...) => $E
      # Suffix forms: pageUrl, feed_url, imageUrl, ... Case-sensitive
      # camel halves keep `curl`-style names out.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^([a-z_0-9]+_(url|uri|href|endpoint|webhook)|[a-z_0-9]+(Url|Uri|Href|Endpoint|Webhook))(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async $F(..., $ARG, ...) { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  (..., $ARG, ...) => $E
              - pattern-inside: |
                  async (..., $ARG, ...) => $E
      # URL-named member reads off any object (config objects, payload
      # objects, parsed request objects): cfg.webhookUrl, options.url,
      # req.url, ...
      - patterns:
          - pattern: $X.$F
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)$'
      # URL-named key reads: config["webhook_url"], payload.get("url"),
      # req.query["target"], searchParams.get("feedUrl"), ...
      - patterns:
          - pattern-either:
              - pattern: $X[$K]
              - pattern: $X.get($K, ...)
          - metavariable-regex:
              metavariable: $K
              regex: >-
                (?i)^["'](url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)["']$
      # HTTP request-object members (Express/Fastify `req`, Koa/Hono `ctx`,
      # Next `request`): query/body member reads off a request receiver
      # are caller-controlled. `ctx.request` (Koa, and Playwright context
      # request clients) is included so members under it stay derived.
      - patterns:
          - pattern-either:
              - pattern: $REQ.$F
              - pattern: $REQ.$F(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: '(.*\.)?(req|request|ctx)$'
          - metavariable-regex:
              metavariable: $F
              regex: '^(query|body|params|param|querystring|nextUrl|searchParams|formData|data|json|args|GET|POST|query_params|path_params|form|values|request)$'
      # Destructured request fields: const { url } = req.query
      - patterns:
          - pattern: $PROP
          - metavariable-regex:
              metavariable: $REQ
              regex: '(.*\.)?(req|request|ctx)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(query|body|params|nextUrl|searchParams|formData)$'
          - pattern-either:
              - pattern-inside: |
                  const { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  let { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  var { ..., $PROP, ... } = $REQ.$M
              - pattern-inside: |
                  { ..., $PROP, ... } = $REQ.$M
      # Verb-named route handlers (Next.js style): export async function
      # GET(request) — the request parameter is the source.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $H
              regex: '^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$'
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(req|request|ctx|event)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  function $H(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $H(..., $ARG, ...) { ... }
              - pattern-inside: |
                  const $H = async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  const $H = (..., $ARG, ...) => { ... }
      # Web framework registrations: the first parameter of an inline
      # callback passed to a router verb (Express/Fastify `app.get(...)`,
      # `router.post(...)`, `server.use(...)`) is the request object.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $M
              regex: '(?i)^(get|post|put|delete|del|patch|head|options|all|use|route|ws)$'
          - pattern-either:
              - pattern-inside: |
                  $APP.$M(..., ($ARG, ...) => { ... })
              - pattern-inside: |
                  $APP.$M(..., async ($ARG, ...) => { ... })
              - pattern-inside: |
                  $APP.$M(..., function $H($ARG, ...) { ... })
              - pattern-inside: |
                  $APP.$M(..., async function $H($ARG, ...) { ... })
      # Agent/tool registrations (one entry family among several): any
      # parameter of a callback registered through a tool registration
      # method (tool, registerTool, setRequestHandler, and the
      # prompt/resource variants). Also covers object-destructured
      # parameters such as `async ({ url }) => ...`.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $REG
              regex: '(tool|registerTool|callTool|getPrompt|setRequestHandler|prompt|resource)'
          - pattern-either:
              - pattern-inside: |
                  $SRV.$REG(..., async (..., $ARG, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., (..., $ARG, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., async (..., $ARG, ...) => ...)
              - pattern-inside: |
                  $SRV.$REG(..., (..., $ARG, ...) => ...)
              - pattern-inside: |
                  $SRV.$REG(..., async function $H(..., $ARG, ...) { ... })
              - pattern-inside: |
                  $SRV.$REG(..., function $H(..., $ARG, ...) { ... })
      - patterns:
          - pattern: $PROP
          - metavariable-regex:
              metavariable: $REG
              regex: '(tool|registerTool|callTool|getPrompt|setRequestHandler|prompt|resource)'
          - pattern-either:
              - pattern-inside: |
                  $SRV.$REG(..., async ({ ..., $PROP, ... }, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., ({ ..., $PROP, ... }, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., async ({ ..., $PROP, ... }: $T, ...) => { ... })
              - pattern-inside: |
                  $SRV.$REG(..., ({ ..., $PROP, ... }: $T, ...) => { ... })
      # Dispatch-method source: a method, function declaration, or
      # object-literal callback named like a tool dispatcher that takes an
      # args/params/request parameter. Covers class-based registries where
      # a CallTool switch delegates to `tool.execute(args, ...)` and the
      # sink lives inside the method body rather than the callback.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(args|arguments|params|request|input)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  async $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  async function $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  function $M(..., $ARG, ...) { ... }
              - pattern-inside: |
                  $M: async (..., $ARG, ...) => { ... }
              - pattern-inside: |
                  $M: (..., $ARG, ...) => { ... }
          - metavariable-regex:
              metavariable: $M
              regex: '^(execute|handle|dispatch|process|invoke|run|call)[a-zA-Z_0-9]*$'
    # Sinks: outbound request calls listed in docs/source-sink-matrix.md.
    # `fetch` covers both the global and a default node-fetch import.
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(fetch|nodeFetch|got|axios|request)'
          - pattern: axios.$M(...)
          - pattern: got.$M(...)
          - patterns:
              - pattern: $P.goto(...)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?i).*(page|browser|ctx)[a-z_0-9]*'
          - patterns:
              - pattern: $C.request.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(get|post|put|delete|head|patch|options|request|stream)$'
    # Sanitizers: only the recognized complete-guard call vocabulary
    # (resolve-all + range check + pinned connect wrappers; see
    # docs/source-sink-matrix.md). by-side-effect covers check-and-throw
    # validators. Everything else, including weak shapes like a bare
    # `new URL(...)` protocol check or an unrecognized helper, leaves the
    # value tainted so the site resolves to a weak class or to
    # unrecognized-guard downstream instead of going silent.
    pattern-sanitizers:
      # A single focused by-side-effect entry covers both forms:
      # `const checked = validatePublicUrl(url)` (the call result is clean)
      # and `assertPublicUrl(x)` (the argument l-value is clean going
      # forward). focus-metavariable is required for by-side-effect to
      # work, and a second unfocused sanitizer entry on the same call
      # disables the side-effect behavior, so this must stay a single
      # entry. Ceiling: it cannot clean a raw handler parameter (the param
      # binding is the source and stays tainted for the whole function body
      # in Semgrep CE); it does clean locals derived from the parameter.
      # Sites that check-and-throw on the raw param still fire here and
      # resolve to recognized-complete via the complete-guard site probe
      # (docs/source-sink-matrix.md).
      - by-side-effect: true
        patterns:
          - pattern: $GUARD($X, ...)
          - metavariable-regex:
              metavariable: $GUARD
              regex: '(?i)((.*[._])?(ssrf|safe_?fetch|safe_?get|safe_?request|assert_?safe|ensure_?public|require_?public)|.*(public_?url|resolve_?and_?pin|pinned_?request))[a-z_0-9]*'
          - focus-metavariable: $X
