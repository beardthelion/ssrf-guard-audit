rules:
  # Site-enumerator and guard-shape probes for the layered site
  # resolution. These are search-mode rules: they mark locations, they do
  # not issue verdicts. classify.py groups their hits by enclosing entry
  # point (the site extent each handler_source match spans) and resolves
  # each sink site per docs/source-sink-matrix.md.
  #
  # A site extent is any function that a source family can deliver a
  # caller-shaped URL into: registered entry points (route/tool
  # decorators, web framework registrations), functions with URL-named
  # parameters, and functions containing URL-named field reads or
  # request-object member reads. The extents exist so guard-shaped calls
  # bind to the sink that consumes their input.
  - id: ssrf-guard-audit-probe-handler-source-python
    message: >-
      Site probe: entry-point candidate (source enumerator). Consumed by
      the ssrf-guard-audit CLI site resolution; not a standalone finding.
    severity: INFO
    languages: [python]
    metadata:
      probe_role: handler_source
      category: audit-probe
      references:
        - docs/source-sink-matrix.md
    pattern-either:
      # Registered entry points: route decorators and agent/tool
      # decorators spanning the decorated function. The decorator method
      # name is the signal, not the receiver, so FastAPI/Starlette
      # @router.get, Flask/Bottle @app.route/@get, Django REST
      # @api_view/@action, FastMCP @tool and vendored variants all match.
      - patterns:
          - metavariable-regex:
              metavariable: $DECO
              regex: '(.*\.)?(tool|call_tool|get_prompt|route|api_route|get|post|put|delete|patch|head|options|websocket|add_url_rule|api_view|action)$'
          - pattern-either:
              - pattern: |
                  @$DECO(...)
                  def $F(...):
                    ...
              - pattern: |
                  @$DECO(...)
                  async def $F(...):
                    ...
              - pattern: |
                  @$DECO
                  def $F(...):
                    ...
              - pattern: |
                  @$DECO
                  async def $F(...):
                    ...
      # Dispatch-method extents: a def/async def named like a tool
      # dispatcher taking an args/params/request parameter, covering
      # class-based registries where a registered callback delegates to
      # `tool.execute(args)` and the sink lives in the method body.
      - patterns:
          - pattern-either:
              - pattern: |
                  async def $M(..., $ARG, ...):
                    ...
              - pattern: |
                  def $M(..., $ARG, ...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(execute|handle|dispatch|process|invoke|run|call)[a-z_0-9]*$'
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(args|arguments|params|request|input)(\W.*)?$'
      # Framework tool-entry methods: agent frameworks that name their
      # entry `Tool.forward` or `BaseTool._run`/`_arun` deliver
      # caller-produced args through methods on Tool-named classes. The
      # class-name bound keeps `forward`/`run` from matching arbitrary
      # helpers.
      - patterns:
          - pattern-inside: |
              class $T(...):
                ...
          - metavariable-regex:
              metavariable: $T
              regex: '(?i).*tool'
          - pattern-either:
              - pattern: |
                  async def $M(...):
                    ...
              - pattern: |
                  def $M(...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(forward|_?run|_?arun|_?call|_?execute|invoke|process)[a-z_0-9]*$'
      # URL-named-parameter functions (exact names).
      - patterns:
          - pattern-either:
              - pattern: |
                  def $F(..., $ARG, ...):
                    ...
              - pattern: |
                  async def $F(..., $ARG, ...):
                    ...
          - metavariable-regex:
              metavariable: $ARG
              regex: '(?i)^(url|uri|href|link|endpoint|callback_?url|callback|webhook_?url|webhook|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)(\W.*)?$'
      # URL-named-parameter functions (suffix forms: page_url, feed_url,
      # camelCase halves case-sensitive so `curl`-style names stay out).
      - patterns:
          - pattern-either:
              - pattern: |
                  def $F(..., $ARG, ...):
                    ...
              - pattern: |
                  async def $F(..., $ARG, ...):
                    ...
          - metavariable-regex:
              metavariable: $ARG
              regex: '^([a-z_0-9]+_(url|uri|href|endpoint|webhook)|[a-z_0-9]+(Url|Uri|Href|Endpoint|Webhook))(\W.*)?$'
      # Functions containing URL-named attribute reads or request-object
      # member reads (config objects, payload models, query/body fields).
      # Member names here are broader than the taint source's
      # receiver-gated list because an extent is only a bounding box.
      - patterns:
          - pattern-either:
              - pattern: |
                  def $F(...):
                    ...
                    <... $X.$A ...>
                    ...
              - pattern: |
                  async def $F(...):
                    ...
                    <... $X.$A ...>
                    ...
          - metavariable-regex:
              metavariable: $A
              regex: '^(url|uri|href|link|endpoint|callback_?[Uu]rl|callback|webhook_?[Uu]rl|jwks_?(uri|url|Uri|Url)|avatar_?[Uu]rl|image_?[Uu]rl|feed_?[Uu]rl|target|host|args|GET|POST|query_params|path_params|form|data|json|params|param|querystring|nextUrl|searchParams|formData|values|query|body|request)$'
      # Functions containing URL-named key reads: cfg["webhook_url"],
      # payload.get("url").
      - patterns:
          - pattern-either:
              - pattern: |
                  def $F(...):
                    ...
                    <... $X[$K] ...>
                    ...
              - pattern: |
                  async def $F(...):
                    ...
                    <... $X[$K] ...>
                    ...
              - pattern: |
                  def $F(...):
                    ...
                    <... $X.get($K, ...) ...>
                    ...
              - pattern: |
                  async def $F(...):
                    ...
                    <... $X.get($K, ...) ...>
                    ...
          - metavariable-regex:
              metavariable: $K
              regex: >-
                (?i)^["'](url|uri|href|link|endpoint|callback_?url|webhook_?url|jwks_?(uri|url)|avatar_?url|image_?url|feed_?url|target|host)["']$

  - id: ssrf-guard-audit-probe-network-sink-python
    message: >-
      Site probe: outbound request call (network-sink enumerator). Consumed
      by the ssrf-guard-audit CLI site resolution; not a standalone finding.
    severity: INFO
    languages: [python]
    metadata:
      probe_role: network_sink
      category: audit-probe
      references:
        - docs/source-sink-matrix.md
    # Identical sink vocabulary to rules/python/g0-unguarded-fetch.yaml so
    # every sink the taint rules can fire on is also enumerated here.
    pattern-either:
      - pattern: requests.$M(...)
      - pattern: httpx.$M(...)
      - pattern: aiohttp.$M(...)
      - pattern: urllib.request.$M(...)
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: '^(urlopen|urlretrieve)$'
      - patterns:
          - pattern: $R.$M(...)
          - metavariable-regex:
              metavariable: $R
              regex: '(?i).*(client|session|driver)[a-z_0-9]*'
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|delete|head|patch|options|request|stream|fetch|ws_connect)$'
      - patterns:
          - pattern: $P.goto(...)
          - metavariable-regex:
              metavariable: $P
              regex: '(?i).*(page|browser|driver)[a-z_0-9]*'
      - patterns:
          - pattern: $C.request.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|delete|head|patch|options|request|stream)$'

  - id: ssrf-guard-audit-probe-complete-guard-python
    message: >-
      Site probe: recognized complete-guard call shape (resolve-all + range
      check + pinned connect wrapper, recognized by callee name). Consumed
      by the ssrf-guard-audit CLI site resolution; not a standalone finding.
    severity: INFO
    languages: [python]
    metadata:
      probe_role: complete_guard
      category: audit-probe
      references:
        - docs/source-sink-matrix.md
    # The same callee-name vocabulary as the G0 sanitizer. A site whose
    # extent contains this call resolves to recognized-complete unless a
    # weak-class finding outranks it.
    patterns:
      - pattern: $GUARD(...)
      - metavariable-regex:
          metavariable: $GUARD
          regex: '(?i)((.*[._])?(ssrf|safe_?fetch|safe_?get|safe_?request|assert_?safe|ensure_?public|require_?public)|.*(public_?url|resolve_?and_?pin|pinned_?request))[a-z_0-9]*'

  - id: ssrf-guard-audit-probe-intervening-validation-python
    message: >-
      Site probe: bounded intervening call or check-and-throw whose shape
      reads as validation. Consumed by the ssrf-guard-audit CLI site
      resolution; a hit with no higher-precedence match resolves the site
      to "guard detected, shape unrecognized, manual review".
    severity: INFO
    languages: [python]
    metadata:
      probe_role: intervening_validation
      category: audit-probe
      references:
        - docs/source-sink-matrix.md
    # Two bounded shapes: a call whose callee name reads as validation, or
    # a check-and-throw (an `if` block containing `raise`). Overlap with
    # the complete-guard vocabulary is intentional; the complete-guard
    # probe wins by precedence at classify time. `urlparse`/`ip_address`
    # style names are deliberately absent from the regex: a parse alone is
    # not a validation attempt, and the matrix assigns urlparse-only paths
    # to G0.
    pattern-either:
      - patterns:
          - pattern: $CALL(...)
          - metavariable-regex:
              metavariable: $CALL
              regex: '(?i).*(valid|check|verif|assert|is_?safe|is_?allowed|is_?ip|ensure|saniti[sz]e|guard|allow|block|deny|filter|resolv|inspect|secure|protect|private|internal|ip_?addr|host_?name)[a-z_0-9]*'
      - pattern: |
          if $COND:
            ...
            raise $E
            ...
