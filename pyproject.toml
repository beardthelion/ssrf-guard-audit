[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssrf-guard-audit"
version = "0.1.0"
description = "Guard-completeness audit for SSRF defenses (G0-G10 taxonomy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["semgrep>=1.177.0,<1.178"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ssrf-guard-audit = "ssrf_guard_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssrf_guard_audit"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "ssrf_guard_audit/rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["corpus", "rules", "dist", "build", "docs"]
